<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="browcord">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d79f7"/>
      <stop offset="0.55" stop-color="#4650d8"/>
      <stop offset="1" stop-color="#2a2f96"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf7"/>
    </linearGradient>

    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b66ee"/>
      <stop offset="1" stop-color="#343dbd"/>
    </linearGradient>

    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0b0f2e" flood-opacity="0.38"/>
    </filter>

    <filter id="cursorLift" x="-40%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0b0f2e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <path d="M0 700 Q 256 560 512 660 T 1024 620 L1024 1024 L0 1024 Z" fill="#ffffff" opacity="0.05"/>

  <g filter="url(#lift)">
    <rect x="140" y="236" width="744" height="552" rx="54" fill="url(#glass)"/>

    <path d="M140 290 A54 54 0 0 1 194 236 H830 A54 54 0 0 1 884 290 V356 H140 Z" fill="#d4dcec"/>

    <circle cx="200" cy="296" r="15" fill="#ff7a66"/>
    <circle cx="248" cy="296" r="15" fill="#ffc44d"/>
    <circle cx="296" cy="296" r="15" fill="#3fd77a"/>

    <rect x="344" y="276" width="480" height="40" rx="20" fill="#b9c4da"/>

    <path d="M447 468 L447 672 L625 570 Z"
          fill="url(#play)" stroke="url(#play)" stroke-width="38"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <g filter="url(#cursorLift)">
    <g transform="translate(612 586) scale(1.55)">
      <path d="M0 0 L0 62 L17 47 L28 72 L41 66 L30 42 L50 42 Z"
            fill="#3fd77a" stroke="#0f1428" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(726 676) scale(1.3)">
      <path d="M0 0 L0 62 L17 47 L28 72 L41 66 L30 42 L50 42 Z"
            fill="#ff7a66" stroke="#0f1428" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
